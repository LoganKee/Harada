/* Harada forest scenes: illustrated SVGs stay transparent; original app icon is unchanged. */
.hero{background:#e7ecd9 url('forest.svg') center center/cover no-repeat;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);min-height:220px}

.forest-banner{min-height:135px;border-radius:22px;margin:8px 0 17px;padding:16px 12px 13px 16px;background:#e6ebd9 url('forest.svg') center/cover no-repeat;position:relative;display:flex;align-items:center;overflow:hidden}

.forest-monkus{position:absolute;right:0;bottom:-5px;height:145px;width:42%;object-fit:contain;object-position:center bottom;filter:drop-shadow(0 5px 4px #30452a24)}
.dark .forest-banner,.dark .hero{background-color:#3e5341; background-blend-mode:multiply}
